<!DOCTYPE HTML>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Test Site</title>
    <link rel="stylesheet" type="text/css" href="CSS/SiteSettings.css">
</head>

<body onload="switchFirstLang()">
    <header>
        <div class="wrapperH">
            <!-- <div class="box1">
                <div class="mRectLogo2">NIOM</div>
            </div> -->
            <nav class="in">
                <a href="index.html" class="Textbut" data-translate="nav_home">Home</a>
                <a href="games.html" class="Textbut" data-translate="nav_games">Games</a>
                <a href="arts.html" class="Textbut" data-translate="nav_arts">Arts</a>
                <a href="about.html" class="Textbut" data-translate="nav_about">About</a>
            </nav>
            <div class="wrapperButtons">
                <button class="ButtonAction" onclick="switchLanguage('en')">EN</button>
                <button class="ButtonAction" onclick="switchLanguage('ru')">RU</button>
            </div>
        </div>
    </header>

    <main class="wrapper">
        <section class="wrapperHero">
            <p class="headerText" data-translate="main_title">Each game is<br>A new adventure!</p>
            <div class="HeaderPhoto">
                <img src="Resources/Background.jpg" alt="Header Image">
            </div>
            </div>
            <div class="wrapperdesc">
                <p class="Text-desc" data-translate="main_description">
                    Hello! I'm Vladislav, a game developer, and this is my website. Here you can find my works - games, 3D art, and more. Here, each game is a new adventure!
                </p>
            </div>
            <div class="wrapperButtons">
                <button class="ButtonAction" onclick="location.href='#games'">
                    <p data-translate="projects">Projects</p>
                </button>
                <button class="ButtonAction" onclick="location.href='about.html'">
                    <p data-translate="more_info">More information</p>
                </button>
            </div>
        </section>
        <hr>
        <a href="games.html" class="TextNameGroup" id="games" data-translate="head_games">Games ></a>
        <section class="Elements">
            <div class="Carousel">
                <button class="VidImg" onclick='openWindow("https://yandex.ru/games/app/456897?draft=true&lang=ru")'><img src="Resources/AstroArena.jpg" alt="Изображение игры"></button>
                <button class="VidImg" onclick='openWindow("https://vladislav8275.itch.io/racinggame")'><img src="Resources/template_logo.jpg" alt="Изображение игры"></button>
                <button class="VidImg" onclick='openWindow("https://vladislav8275.itch.io/fish-it")'><img src="Resources/icon1.jpg" alt="Изображение игры"></button>
                <button class="VidImg" onclick='openWindow("https://vladislav8275.itch.io/choose-of-two")'><img src="Resources/icon3.jpg" alt="Изображение игры"></button>
            </div>
        </section>
        <hr>
        <a href="arts.html" class="TextNameGroup" id="games" data-translate="head_arts">Arts ></a>
        <section class="Elements">
            <div class="Carousel">
                <button class="VidImg" onclick='openWindow("https://www.artstation.com/artwork/YG4rlX")'><img src="Resources/niom-fullrender4.jpg" alt="Изображение арта"></button>
                <button class="VidImg" onclick='openWindow("https://www.artstation.com/artwork/ZlmPmX")'><img src="Resources/r32.jpg" alt="Изображение арта"></button>
                <button class="VidImg" onclick='openWindow("https://www.artstation.com/artwork/XJ2Gxl")'><img src="Resources/niom-r23.jpg" alt="Изображение арта"></button>
                <button class="VidImg" onclick='openWindow("https://www.artstation.com/artwork/P6GA04")'><img src="Resources/art2.jpg" alt="Изображение арта"></button>
                <button class="VidImg" onclick='openWindow("https://www.artstation.com/artwork/nJvE16")'><img src="Resources/niom-testrend40.jpg" alt="Изображение арта"></button>
            </div>
        </section>
    </main>
    <script src="Scripts/Script.js"></script>
</body>

</html>
