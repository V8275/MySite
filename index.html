<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V8275 — Game Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700;800&family=Lemon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">V8275</a>
            <nav class="nav">
                <a href="index.html" class="nav__link" data-translate="nav_home">Home</a>
                <a href="games.html" class="nav__link" data-translate="nav_games">Games</a>
                <a href="arts.html" class="nav__link" data-translate="nav_arts">Arts</a>
                <a href="about.html" class="nav__link" data-translate="nav_about">About</a>
            </nav>
            <div class="lang-switch">
                <button class="lang-switch__btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
                <button class="lang-switch__btn" data-lang="ru" onclick="switchLanguage('ru')">RU</button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <section class="hero">
                <div class="reveal">
                    <h1 class="hero__title" data-translate="main_title">Each game is a new adventure!</h1>
                    <p class="hero__desc" data-translate="main_description">
                        Hello! I'm Vladislav, a game developer, and this is my website.
                    </p>
                    <div class="btn-group">
                        <a href="#games" class="btn btn--primary" data-translate="projects">Projects</a>
                        <a href="about.html" class="btn btn--ghost" data-translate="more_info">More information</a>
                    </div>
                </div>
                <div class="hero__visual reveal reveal--d2">
                    <img class="hero__image" src="Resources/Background.jpg" alt="Vladislav — game developer">
                </div>
            </section>

            <hr class="divider">

            <section class="section" id="games">
                <div class="section__head">
                    <h2 class="section__title" data-translate="head_games">Games</h2>
                    <a href="games.html" class="section__link" data-translate="view_all">View all →</a>
                </div>
                <div class="grid">
                    <button class="card" onclick='openWindow("https://yandex.ru/games/app/456897")'><img src="Resources/AstroArena.jpg" alt="Astro Arena"></button>
                    <button class="card" onclick='openWindow("https://vladislav8275.itch.io/racinggame")'><img src="Resources/template_logo.jpg" alt="Racing Game"></button>
                    <button class="card" onclick='openWindow("https://vladislav8275.itch.io/fish-it")'><img src="Resources/icon1.jpg" alt="Fish It"></button>
                    <button class="card" onclick='openWindow("https://vladislav8275.itch.io/choose-of-two")'><img src="Resources/icon3.jpg" alt="Choose of Two"></button>
                </div>
            </section>

            <hr class="divider">

            <section class="section">
                <div class="section__head">
                    <h2 class="section__title" data-translate="head_arts">Arts</h2>
                    <a href="arts.html" class="section__link" data-translate="view_all">View all →</a>
                </div>
                <div class="grid">
                    <button class="card" onclick='openWindow("https://www.artstation.com/artwork/OvWY4v")'><img src="Resources/lancia.jpg" alt="Art 1"></button>
                    <button class="card" onclick='openWindow("https://www.artstation.com/artwork/YG4rlX")'><img src="Resources/niom-fullrender4.jpg" alt="Art 2"></button>
                    <button class="card" onclick='openWindow("https://www.artstation.com/artwork/ZlmPmX")'><img src="Resources/r32.jpg" alt="Art 3"></button>
                    <button class="card" onclick='openWindow("https://www.artstation.com/artwork/XJ2Gxl")'><img src="Resources/niom-r23.jpg" alt="Art 4"></button>
                    <button class="card" onclick='openWindow("https://www.artstation.com/artwork/P6GA04")'><img src="Resources/art2.jpg" alt="Art 5"></button>
                    
                </div>
            </section>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
